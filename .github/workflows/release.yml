name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  # Kept in step with test.yml: releasing on an older toolchain than the one
  # the tests and the vulnerability scan run on defeats both.
  # Pinned to the patch, not the minor. `1.26.x` can resolve to a toolchain
  # that still ships standard-library advisories -- go1.26.6 fixes four that
  # govulncheck reports against 1.26.5. Bump this when the scan fails on the
  # standard library: that is the gate working.
  GO_VERSION: '1.26.6'

jobs:
  build:
    name: Build and Release
    runs-on: ubuntu-latest

    strategy:
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set version info
        id: vars
        run: |
          echo "VERSION=${GITHUB_REF#refs/tags/}" >> "$GITHUB_ENV"
          echo "COMMIT=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Build static binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ env.VERSION }}
          COMMIT: ${{ env.COMMIT }}
          DATE: ${{ env.DATE }}
        run: |
          mkdir -p dist
          output="dist/fpm-exporter-${GOOS}-${GOARCH}"
          CGO_ENABLED=0 go build \
            -ldflags "-X 'main.version=${VERSION}' -X 'main.commit=${COMMIT}' -X 'main.date=${DATE}' -w -s" \
            -o "$output" .

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/fpm-exporter-${{ matrix.goos }}-${{ matrix.goarch }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  checksums:
    name: Publish checksums
    needs: build
    runs-on: ubuntu-latest

    steps:
      # install.sh verifies the binary it downloads against this file, so it has
      # to cover every asset -- hence a job that runs after the whole matrix.
      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          gh release download "${GITHUB_REF#refs/tags/}" \
            --repo "$GITHUB_REPOSITORY" --dir dist --pattern 'fpm-exporter-*'

      - name: Generate checksums
        run: |
          cd dist
          sha256sum fpm-exporter-* > checksums.txt
          cat checksums.txt

      - name: Upload checksums
        uses: softprops/action-gh-release@v2
        with:
          files: dist/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
